[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-ai-lab"
version = "5.0.4"
description = "PF AI Lab 5.0.4 — Moteur Python corrige pour P.F.Algo V.69.1 (corrections D1-D13 PineGuard)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PF AI Lab"},
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
optimize = [
    "optuna>=3.0",
]
full = [
    "optuna>=3.0",
    "flask>=2.0",
    "openpyxl>=3.0",
]

[project.scripts]
pf-ai-lab = "pf_ai_lab.cli:main"
pineguard = "pineguard.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["pineguard/tests", "pf_ai_lab/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["pineguard*", "pf_ai_lab*"]
